# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-startech"
BBFILE_PATTERN_meta-startech = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-startech = "6"

LAYERDEPENDS_meta-startech = "core"
LAYERSERIES_COMPAT_meta-startech = "scarthgap"
