header:
  version: 14

local_conf_header:
  standard: |
    CONF_VERSION = "2"
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
    IMAGE_INSTALL:append = " dropbear openssh-sftp-server connman"
    EXTRA_IMAGE_FEATURES:append = " ssh-server-dropbear debug-tweaks"
  
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"